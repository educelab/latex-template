name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAPER_NAME: main

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build with latexmk
        run: docker run --rm -v "$PWD":/work -w /work texlive/texlive:latest latexmk

      - name: Name PDF
        run: cp build/main.pdf "${PAPER_NAME}-$(date +%Y%m%d%H%M).pdf"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ env.PAPER_NAME }}-*.pdf
          retention-days: 30
